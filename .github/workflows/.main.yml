on:
  push:
    branches:
      - main
name: 🚀 Deploy previews on push
jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4

    - name: 📂 Sync files
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USER }}
        password: ${{ secrets.FTP_PASSWORD }}
        # Mesmo login FTP do devbatista_site: os previews ficam em
        # devbatista.com/previews/, como era antes da separação do repositório.
        server-dir: /
        # Ao declarar exclude, os padrões default são substituídos —
        # por isso os de git precisam ser repetidos aqui.
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**
          **/.DS_Store
          README.md
